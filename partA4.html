<!DOCTYPE html>
<html>
<head>
    <title>Table with Rowspan</title>
</head>
<body>
        <table border="1">
            <caption>Welcome to My Shop</caption>
            <tr>
                <th>Food</th>
                <th>Price</th>
            </tr>
            <tr>
                <td>Nasi Goreng</td>
                <td>RM 6.50</td>
            </tr>
            <tr>
                <td>Nasi Ayam</td>
                <td>RM 8.50</td>
            </tr>
            <tr>
                <td colspan="2">Ayam Percik Sold Out</td>
            </tr>
            <tr>
                <td>yam Goreng</td>
            <td rowspan="2">RM 2.00</td>
            </tr>
            <tr>
                <td>Telur Mata</td>
            </tr>
        </table>
</body>
</html>
