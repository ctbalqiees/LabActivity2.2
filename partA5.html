<!DOCTYPE html>
<html>
<head>
  <title>Table with Inserted Picture</title>
</head>
<body>
  <table border="1" cellspacing="0" cellpadding="5">
    <tr>
      <th>Menu</th>
      <th>Price</th>
    </tr>
    <tr>
      <td>Nasi Ayam</td>
      <td>RM 8.00</td>
    </tr>
    <tr>
      <td>Nasi Goreng</td>
      <td>RM 6.50</td>
    </tr>
    <tr>
      <td colspan="2" style="text-align:center;">Ayam Percik Sold Out</td>
    </tr>
    <tr>
      <td>Ayam Goreng</td>
      <td rowspan="2">RM 2.00</td>
    </tr>
    <tr>
      <td>Telur Mata</td>
    </tr>
    <tr>
      <td colspan="2" style="text-align:center;">
        <img src="nasi ayam.jpg" alt="Thank You!" width="150">
      </td>
    </tr>
  </table>
</body>
</html>
