<!DOCTYPE html>
<html>
<head>
    <title>Lab Exercise 2.1 HTML Part B</title>
</head>
<body>
    <h2>LAB EXERCISE 2.1 HTML PART B</h2>

    <form action="#" method="post">
        <label for="name">Name:</label>
            <input type="text" id="name" name="name"><br><br>

        <label for="password">Password:</label>
            <input type="password" id="password" name="password"><br><br>

        <label>Gender:</label><br>
            <input type="radio" name="gender" value="Male"> Male<br>
            <input type="radio" name="gender" value="Female"> Female<br>
            <input type="radio" name="gender" value="Other"> Other<br><br>

        <label for="age">Age:</label>
        <select id="age" name="age">
            <option value="">Select Age</option>
            <option value="18-25">18-25</option>
            <option value="26-35">26-35</option>
            <option value="36-45">36-45</option>
            <option value="46+">46+</option>
        </select><br><br>

    <label for="interests">Interests:</label><br>
    <textarea id="interests" name="interests" rows="4" cols="30"></textarea><br><br>

    <label>Subscribe to Newsletter:</label><br>
        <input type="checkbox" name="subscribe" value="Yes"> Yes
        <input type="checkbox" name="subscribe" value="No"> No
        <input type="checkbox" name="subscribe" value="Not Interested"> Not Interested<br><br>

    <input type="submit" value="Submit">
  </form>
</body>
</html>
